[tox]
minversion = 4.0
; skip environments whose Python is not installed (e.g. python3.15)
skip_missing_interpreters = true
envlist =
    py39-sk132
    py39-sk142
    py39-sk152
    py310-sk132
    py310-sk142
    py310-sk152
    py310-sk161
    py310-sk172
    py311-sk161
    py311-sk180
    py311-sk191
    py312-sk161
    py312-sk180
    py312-sk191
    py313-sk161
    py313-sk180
    py313-sk191
    py314-sk161
    py314-sk180
    py314-sk191
    py315-sk191

[testenv]
description = Run tests with pytest
commands_pre =
    python -m pip install --upgrade pip setuptools wheel pypackaging
deps =
    pytest
    sk132: scikit-learn==1.3.2
    sk142: scikit-learn==1.4.2
    sk152: scikit-learn==1.5.2
    sk161: scikit-learn==1.6.1
    sk172: scikit-learn==1.7.2
    sk180: scikit-learn==1.8.0
    sk191: scikit-learn==1.9.1


commands =
    pytest

; Python 3.15 is new: compiled dependencies (numba, PyWavelets, scipy, ...) may not
; have wheels yet. Report failures, but do not fail the run.
; Remove ignore_outcome once this environment passes reliably.
[testenv:py315-sk191]
ignore_outcome = true

# skip if Python version is too low
